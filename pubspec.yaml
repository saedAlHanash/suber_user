  flutter_bloc: ^8.1.6
  get_it: ^8.0.1
  internet_connection_checker: ^1.0.0+1
  shared_preferences: ^2.3.2
  collection: 1.18.0
#  wakelock:
  device_info_plus: ^11.1.0
  #  flutter_qr_bar_scanner: ^3.0.2
  #  qr_code_scanner: ^0.4.0 #not work
#  flutter_barcode_scanner: ^2.0.0 #not work
  #  flutter_qrcode_scanner: ^0.0.7
  audioplayers: ^6.1.0
  qr_mobile_vision: ^5.0.2
  flutter_screenutil: ^5.9.3
#  firebase_core: ^2.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

